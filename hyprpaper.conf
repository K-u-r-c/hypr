# Nieużywany – wallpaper.sh odpala hyprpaper (obrazy) z własnym configiem generowanym w $XDG_RUNTIME_DIR,
# a wideo/GIF-y przez mpvpaper. Zostaje jako fallback dla samego hyprpaper.
# Pusty "monitor" = wszystkie monitory.
wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/black.png
    fit_mode = cover
}
