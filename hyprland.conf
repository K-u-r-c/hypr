# monitory + przypisanie workspace'ów są per-komputer
source = ~/.config/hypr/monitors.conf

$mainMod = SUPER
$terminal = alacritty
$fileManager = dolphin
$menu = hyprlauncher
$browser = zen-browser

exec-once = ~/.config/waybar/launch.sh
exec-once = ~/.config/hypr/wallpaper.sh restore
exec-once = ~/.config/waybar/autohide.sh
# wygaszacz po 5 min, wyłączenie ekranu po 20 min (hypridle.conf, screensaver.sh)
exec-once = hypridle
# numer pulpitu na chwilę na środku ekranu po przełączeniu (workspace-osd.py)
exec-once = ~/.config/hypr/workspace-osd.py
# command center: https://github.com/K-u-r-c/command-center (~/.local/bin/command-center -> command_center.py)
exec-once = ~/.local/bin/command-center --daemon

input {
    kb_layout = pl
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    layout = dwindle

    col.active_border = rgba(555555ff)
    col.inactive_border = rgba(222222ff)
}

decoration {
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
    }
}

animations {
    enabled = true
    animation = layersIn, 1, 4, default, fade
    animation = layersOut, 1, 1.3, default, fade
}

layerrule = blur on, match:namespace ^(command-center)$
layerrule = blur on, match:namespace ^(workspace-osd)$
layerrule = animation popin 85%, match:namespace ^(workspace-osd)$


bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, W, exec, ~/.config/hypr/killactive.sh
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, G, exec, $menu
bind = $mainMod, V, togglefloating
bind = $mainMod, Z, exec, $browser
bind = $mainMod, TAB, exec, ~/.local/bin/command-center
# Emergency: kill a stuck command center and start a fresh daemon
bind = $mainMod SHIFT, TAB, exec, ~/.local/bin/command-center-restart

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

binde = $mainMod CTRL, left, resizeactive, -50 0
binde = $mainMod CTRL, right, resizeactive, 50 0
binde = $mainMod CTRL, up, resizeactive, 0 -50
binde = $mainMod CTRL, down, resizeactive, 0 50

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = ,Print, exec, grim - | tee ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy
bind = SHIFT,Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy
bind = CTRL,Print, exec, grim -g "$(slurp)" - | wl-copy

# Wygaszacz (screensaver.sh): pływający na cały monitor, bez animacji wejścia
windowrule = float on, match:class ^(screensaver)$
windowrule = size monitor_w monitor_h, match:class ^(screensaver)$
windowrule = move 0 0, match:class ^(screensaver)$
windowrule = pin on, match:class ^(screensaver)$
windowrule = no_anim on, match:class ^(screensaver)$

# Dolphin: match Alacritty opacity
windowrule = opacity 0.95 0.95, match:class ^(org.kde.dolphin)$

