# Bezczynność (hypridle, autostart w hyprland.conf). Filmy w przeglądarce/mpv blokują liczenie same.
general {
    before_sleep_cmd = ~/.config/hypr/screensaver.sh stop
}

# 5 min: wygaszacz Matrix, ruch myszy / klawisz go zamyka
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/screensaver.sh start
    on-resume = ~/.config/hypr/screensaver.sh stop
}

# 20 min: ekran całkiem gaśnie (OLED: zero wypalania, zero prądu)
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
